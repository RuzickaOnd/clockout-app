<meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden;background:#0A0B14}
.canvas{position:relative;width:1024px;height:500px;overflow:hidden;
  background:linear-gradient(118deg,#090A13 0%,#141329 42%,#241A3C 74%,#33214A 100%);
  font-family:"SF Pro Display",-apple-system,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.g-purple{width:760px;height:760px;right:-160px;top:-330px;
  background:radial-gradient(circle,rgba(147,51,234,.34) 0%,rgba(147,51,234,0) 68%)}
.g-indigo{width:720px;height:720px;right:80px;top:-60px;
  background:radial-gradient(circle,rgba(99,102,241,.30) 0%,rgba(99,102,241,0) 66%)}
.g-amber{position:absolute;width:1250px;height:520px;left:50%;transform:translateX(-38%);
  bottom:-300px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,203,107,.30) 0%,rgba(245,158,11,.13) 40%,rgba(245,158,11,0) 70%)}
.g-deep{position:absolute;inset:auto 0 0 0;height:190px;
  background:linear-gradient(to top,rgba(10,11,20,.42),rgba(10,11,20,0))}
.stars{position:absolute;inset:0}

.left{position:absolute;left:82px;top:0;height:500px;width:560px;
  display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.22em;color:#B4C0FF;margin-bottom:18px}
h1{font-size:57px;line-height:1.06;font-weight:600;letter-spacing:-.022em;color:#F8FAFC}
h1 .warm{background:linear-gradient(96deg,#FFD98A 0%,#FBBF24 46%,#F59E0B 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:20px;font-size:16.5px;line-height:1.5;font-weight:400;color:#A3AEC4;max-width:430px}
.chips{margin-top:26px;display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:7px;padding:7px 13px 7px 10px;border-radius:999px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);
  font-size:12px;font-weight:500;color:#CBD5E1;white-space:nowrap}
.chip b{display:flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:50%;background:rgba(99,102,241,.45);border:1px solid rgba(165,180,252,.45);
  font-size:9.5px;font-weight:700;color:#E9EAFF}
.foot{margin-top:26px;font-size:11.5px;letter-spacing:.055em;color:#75809B;font-weight:500}

.art{position:absolute;right:58px;top:40px;width:420px;height:420px}
</style>
